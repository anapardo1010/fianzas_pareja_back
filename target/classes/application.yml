spring:
  datasource:
    # Añadimos parámetros seguros para Postgres en entornos con desconexiones:
    # - autosave=always: evita errores en transacciones cuando el servidor invalida statements
    # - preferQueryMode=simple: reduce uso de prepared portals cuando hay proxies/gateway
    # - tcpKeepAlive=true: ayuda a mantener viva la conexión
    # Puedes sobreescribir SPRING_DATASOURCE_URL en Render; estos parámetros son por defecto locales.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pareja_finanzas?autosave=always&preferQueryMode=simple&tcpKeepAlive=true}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:flamin1010200}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Validación de conexiones para evitar usar sockets inválidos
      connection-test-query: SELECT 1
      validation-timeout: 5000
      # Tiempo máximo para obtener una conexión del pool
      connection-timeout: 15000
      # Mantener algunas conexiones siempre activas
      minimum-idle: 2
      maximum-pool-size: 10
      # Cerrar conexiones inactivas para evitar sockets muertos
      idle-timeout: 60000
      # Renovar conexiones periódicamente (mitiga estados zombis en proxies)
      max-lifetime: 1800000
      # Mantener vivo con pings
      keepalive-time: 600000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Evitar caching agresivo de statements si el entorno los invalida
        jdbc.batch_size: 0
        order_inserts: false
        order_updates: false

jwt:
  secret: ${JWT_SECRET:TuClaveSecretaSuperSeguraParaJWT2024FinanzasApp123456789}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://finanzas-pareja-front.onrender.com}

server:
  port: ${PORT:8080}

# Configuración de Springdoc/Swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

logging:
  level:
    org.example.app.security: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
